<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>The Game Awards DiEx Edition</title>
    <meta
      name="description"
      content="Votação da comunidade DiEx no estilo The Game Awards."
    />

    <!--
      Descobre a pasta raiz do site (ex.: /DiExAwardsVote2026/) para que
      css, js e imagens funcionem também nas páginas /categorias/<nome>.
      Precisa ficar antes de qualquer <link> ou <script src>.
    -->
    <script>
      (function () {
        var p = location.pathname;
        var i = p.indexOf("/categorias/");
        var base = i >= 0 ? p.slice(0, i + 1) : p.replace(/[^/]*$/, "");
        document.write('<base href="' + base + '">');
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,700;6..96,900&family=Inter:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="pagina">
      <header class="topo">
        <a class="marca" href="./" data-link>DiEx <span>Awards</span></a>
        <div class="conta" id="me" aria-live="polite">
          <span class="hint">Carregando…</span>
        </div>
      </header>

      <nav
        class="barra"
        id="barra"
        aria-label="Navegação entre categorias"
        hidden
      ></nav>

      <div class="notice" id="aviso" hidden></div>

      <main id="app"></main>
    </div>

    <div class="toast" id="toast" role="status" hidden></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
