<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>The Game Awards DiEx Edition</title>
    <meta
      name="description"
      content="Votação da comunidade DiEx no estilo The Game Awards."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,700;6..96,900&family=Inter:wght@400;500;600&display=swap"

    <link rel="stylesheet" href="css/style.css" />

    <div class="wrap">
      <header class="hero">
        <h1>The Game Awards<br /><em>DiEx Edition</em></h1>

        <span class="hint">Carregando…</span>
      </section>

      <div class="notice" id="aviso" hidden></div>

      <div class="wrap categorias" id="cats"></div>
    </div>

    <div class="toast" id="toast" role="status" hidden></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
