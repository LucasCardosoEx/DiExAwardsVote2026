<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Game Awards DiEx Edition</title>
<meta name="description" content="Votação da comunidade DiEx no estilo The Game Awards.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,700;6..96,900&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#0b0d12; --surface:#141822; --surface-2:#1c2130; --line:#2a3042;
  --fg:#eef0f5; --muted:#9aa2b6; --gold:#e8b44c; --discord:#5865f2; --danger:#ff6b6b;
  --display:"Bodoni Moda", Georgia, "Times New Roman", serif;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.5;font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:40px}

header.hero{position:relative;overflow:hidden;border-radius:14px;border:1px solid var(--line);
  background:radial-gradient(120% 90% at 85% 10%,#3a2a10 0%,transparent 55%),radial-gradient(90% 80% at 10% 100%,#10233a 0%,transparent 60%),var(--surface);
  padding:40px 28px;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600}
h1{font-family:var(--display);font-weight:900;font-size:clamp(40px,7vw,76px);line-height:.95;margin:0;text-wrap:balance}
h1 em{font-style:normal;color:var(--gold)}
.hero p{margin:0;color:var(--muted);max-width:60ch}

.me{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.me .who{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.me .who b{font-size:16px}
.hint{color:var(--muted);font-size:13px}
button{font:inherit;font-weight:600;border-radius:8px;padding:10px 16px;border:1px solid transparent;cursor:pointer}
button.discord{background:var(--discord);color:#fff;display:inline-flex;align-items:center;gap:10px}
button.ghost{background:transparent;color:var(--fg);border-color:var(--line);font-weight:500}
button:focus-visible,.nom:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.cat{display:flex;flex-direction:column;gap:16px}
.cat h2{font-family:var(--display);font-weight:700;font-size:clamp(24px,3.4vw,34px);margin:0;line-height:1.1;text-wrap:balance}
.cat h2 small{display:block;font-family:var(--body);font-size:13px;font-weight:500;color:var(--gold);letter-spacing:.12em;text-transform:uppercase;margin-top:6px}
.cat > p{margin:0;color:var(--muted);max-width:70ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.nom{position:relative;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;padding:0;color:var(--fg);font-weight:400;transition:transform .15s,border-color .15s}
.nom:hover{transform:translateY(-2px);border-color:#4a5068}
.nom[disabled]{cursor:default}
.nom[disabled]:hover{transform:none}
.nom.mine{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 8px 30px -10px var(--gold)}
.nom .art{aspect-ratio:3/4;position:relative;display:flex;align-items:flex-end;padding:10px;background:var(--g);background-size:cover;background-position:center}
.nom .art .mono{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:44px;color:#ffffffd9;letter-spacing:-.02em;text-shadow:0 2px 20px #0006}
.nom .art.has-img::after{content:"";position:absolute;inset:50% 0 0;background:linear-gradient(transparent,#000b)}
.nom .votes{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:4px}
.nom .count{position:absolute;z-index:1;top:8px;right:8px;background:#000a;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.nom .badge{position:absolute;z-index:1;top:8px;left:8px;background:var(--gold);color:#1a1205;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:700;letter-spacing:.04em}
.nom .info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.nom .info b{font-size:13px;text-transform:uppercase;letter-spacing:.03em}
.nom .info span{font-size:12px;color:var(--muted)}

.av{width:30px;height:30px;border-radius:50%;object-fit:cover;border:2px solid var(--bg);background:var(--surface-2);flex:none;display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--fg)}
.av.lg{width:44px;height:44px}
.pend{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.pend .lbl{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.pend .list{display:flex;flex-wrap:wrap;gap:6px}
.notice{padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.notice.err{color:var(--danger);border-color:#ff6b6b55}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){.nom{transition:none}.nom:hover{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>The Game Awards<br><em>DiEx Edition</em></h1>
  </header>

  <section class="me" id="me" aria-live="polite"><span class="hint">Carregando…</span></section>
  <div id="aviso" class="notice" hidden></div>
  <div id="cats" class="wrap" style="gap:48px"></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const CFG = window.DIEX_CONFIG;
const CATS = CFG.categorias;
const $ = s => document.querySelector(s);
let sb = null, session = null, perfis = {}, votos = {}, ocupado = false;

const iniciais = t => t.replace(/[^\p{L}\p{N} ]/gu, "").split(" ").filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase();

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 3500);
}
function aviso(msg, erro){
  const a = $("#aviso"); a.textContent = msg || ""; a.hidden = !msg; a.classList.toggle("err", !!erro);
}

function avatar(p, cls = ""){
  if (p && p.avatar){
    const i = document.createElement("img");
    i.className = "av " + cls; i.src = p.avatar; i.alt = p.nick || ""; i.title = p.nick || ""; i.loading = "lazy";
    i.onerror = () => i.replaceWith(avatar({ nick: p.nick }, cls));
    return i;
  }
  const d = document.createElement("span");
  d.className = "av " + cls; d.textContent = ((p && p.nick) || "?")[0].toUpperCase(); d.title = (p && p.nick) || "";
  return d;
}

function nickDoDiscord(u){
  const m = u.user_metadata || {};
  return (m.custom_claims && m.custom_claims.global_name) || m.full_name || m.name || m.user_name || "Sem nome";
}

// ---------- Topo: login / perfil ----------
function renderMe(){
  const box = $("#me"); box.replaceChildren();
  if (!sb){ const s = document.createElement("span"); s.className = "hint"; s.textContent = "Site ainda não configurado."; box.append(s); return; }

  if (!session){
    const who = document.createElement("div"); who.className = "who";
    const s = document.createElement("span"); s.className = "hint";
    s.textContent = CFG.votacaoAberta ? "Entre com sua conta do Discord para votar. Seu nick e sua foto vêm de lá." : "A votação está encerrada. Confira o resultado abaixo.";
    who.append(s);
    box.append(who);
    if (CFG.votacaoAberta){
      const b = document.createElement("button"); b.className = "discord";
      b.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20.3 4.4A19.6 19.6 0 0 0 15.4 3l-.6 1.3a18 18 0 0 0-5.6 0L8.6 3a19.6 19.6 0 0 0-4.9 1.5C.6 9.1-.3 13.7.1 18.2a19.8 19.8 0 0 0 6 3l1.3-2.1a12.8 12.8 0 0 1-2-1l.5-.4a14 14 0 0 0 12.2 0l.5.4c-.6.4-1.3.7-2 1l1.3 2.1a19.7 19.7 0 0 0 6-3c.5-5.2-.8-9.8-3.6-13.8ZM8.3 15.5c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Zm7.4 0c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Z"/></svg><span>Entrar com Discord</span>';
      b.onclick = entrar;
      box.append(b);
    }
    return;
  }

  const meuId = session.user.id;
  const p = perfis[meuId] || { nick: nickDoDiscord(session.user), avatar: (session.user.user_metadata || {}).avatar_url };
  const who = document.createElement("div"); who.className = "who";
  const t = document.createElement("div");
  const b = document.createElement("b"); b.textContent = p.nick;
  const h = document.createElement("div"); h.className = "hint";
  const n = CATS.filter(c => votos[meuId] && votos[meuId][c.id]).length;
  h.textContent = CFG.votacaoAberta ? `Você votou em ${n} de ${CATS.length} categorias` : "Votação encerrada";
  t.append(b, h); who.append(avatar(p, "lg"), t);
  const sair = document.createElement("button"); sair.className = "ghost"; sair.textContent = "Sair";
  sair.onclick = async () => { await sb.auth.signOut(); };
  box.append(who, sair);
}

// ---------- Categorias ----------
function renderCats(){
  const root = $("#cats"); root.replaceChildren();
  const ids = Object.keys(perfis);
  const meuId = session && session.user.id;

  for (const c of CATS){
    const sec = document.createElement("section"); sec.className = "cat";
    const h = document.createElement("h2"); h.textContent = c.nome;
    if (c.en){ const sm = document.createElement("small"); sm.textContent = c.en; h.append(sm); }
    const d = document.createElement("p"); d.textContent = c.desc || "";
    const g = document.createElement("div"); g.className = "grid";

    for (const n of c.indicados){
      const quem = ids.filter(id => votos[id] && votos[id][c.id] === n.id);
      const meu = meuId && votos[meuId] && votos[meuId][c.id] === n.id;
      const b = document.createElement("button"); b.type = "button";
      b.className = "nom" + (meu ? " mine" : "");
      b.disabled = !CFG.votacaoAberta;
      b.setAttribute("aria-label", `${n.titulo}, ${n.sub || ""}. ${quem.length} voto(s).${meu ? " Seu voto." : ""}`);

      const art = document.createElement("div"); art.className = "art";
      if (n.imagem){ art.classList.add("has-img"); art.style.backgroundImage = `url("${n.imagem}")`; }
      else { art.style.setProperty("--g", n.cor || "linear-gradient(160deg,#3a4058,#141822)");
             const mono = document.createElement("span"); mono.className = "mono"; mono.textContent = iniciais(n.titulo); art.append(mono); }
      const vs = document.createElement("div"); vs.className = "votes";
      quem.forEach(id => vs.append(avatar(perfis[id])));
      art.append(vs);
      if (quem.length){ const ct = document.createElement("span"); ct.className = "count"; ct.textContent = quem.length; art.append(ct); }
      if (meu){ const bd = document.createElement("span"); bd.className = "badge"; bd.textContent = "SEU VOTO"; art.append(bd); }

      const info = document.createElement("div"); info.className = "info";
      const tb = document.createElement("b"); tb.textContent = n.titulo;
      const ts = document.createElement("span"); ts.textContent = n.sub || "";
      info.append(tb, ts);
      b.append(art, info);
      b.onclick = () => votar(c.id, n.id);
      g.append(b);
    }

    const pend = document.createElement("div"); pend.className = "pend";
    const falta = ids.filter(id => !(votos[id] && votos[id][c.id]));
    const lbl = document.createElement("span"); lbl.className = "lbl";
    lbl.textContent = !ids.length ? "Ninguém entrou ainda" : falta.length ? "Ainda não votaram" : "Todo mundo já votou";
    const list = document.createElement("div"); list.className = "list";
    falta.forEach(id => list.append(avatar(perfis[id])));
    pend.append(lbl, list);

    sec.append(h, d, g, pend);
    root.append(sec);
  }
}

function render(){ renderMe(); renderCats(); }

// ---------- Ações ----------
async function entrar(){
  const volta = location.origin + location.pathname;
  const { error } = await sb.auth.signInWithOAuth({ provider: "discord", options: { redirectTo: volta, scopes: "identify" } });
  if (error) aviso("Não deu para abrir o login do Discord: " + error.message, true);
}

async function votar(cat, nom){
  if (!CFG.votacaoAberta) return;
  if (!session){ toast("Entre com o Discord para votar."); $("#me button")?.focus(); return; }
  if (ocupado) return;
  ocupado = true;
  const id = session.user.id;
  const antes = Object.assign({}, votos[id] || {});
  const tirar = antes[cat] === nom;

  // atualiza na tela na hora
  votos[id] = Object.assign({}, antes);
  if (tirar) delete votos[id][cat]; else votos[id][cat] = nom;
  render();

  const { error } = tirar
    ? await sb.from("votos").delete().eq("user_id", id).eq("categoria", cat)
    : await sb.from("votos").upsert({ user_id: id, categoria: cat, indicado: nom, votado_em: new Date().toISOString() }, { onConflict: "user_id,categoria" });

  ocupado = false;
  if (error){ votos[id] = antes; render(); toast("Seu voto não foi salvo. Tente de novo."); console.error(error); }
}

async function salvarPerfil(){
  if (!session) return;
  const u = session.user;
  const p = { id: u.id, nick: nickDoDiscord(u), avatar: (u.user_metadata || {}).avatar_url || null, atualizado_em: new Date().toISOString() };
  perfis[u.id] = p;
  const { error } = await sb.from("perfis").upsert(p);
  if (error) console.error(error);
}

async function carregar(){
  const [p, v] = await Promise.all([ sb.from("perfis").select("id,nick,avatar"), sb.from("votos").select("user_id,categoria,indicado") ]);
  if (p.error || v.error){ aviso("Não deu para carregar os votos. Confira se o setup.sql foi rodado no Supabase.", true); console.error(p.error || v.error); return; }
  aviso("");
  perfis = {}; p.data.forEach(r => perfis[r.id] = r);
  votos = {}; v.data.forEach(r => { (votos[r.user_id] ||= {})[r.categoria] = r.indicado; });
  render();
}

let recarga;
function agendarRecarga(){ clearTimeout(recarga); recarga = setTimeout(carregar, 250); }

// ---------- Início ----------
(async function iniciar(){
  $("#eyebrow").textContent = CFG.votacaoAberta ? "Votação da comunidade · aberta" : "Votação da comunidade · encerrada";
  renderCats();

  const configurado = CFG.supabaseUrl && !CFG.supabaseUrl.includes("SEU-PROJETO") && CFG.supabaseAnonKey && !CFG.supabaseAnonKey.includes("COLE");
  if (!configurado || !window.supabase){
    renderMe();
    aviso(!window.supabase ? "Não deu para carregar a biblioteca do Supabase. Verifique sua conexão." : "Preencha supabaseUrl e supabaseAnonKey no arquivo config.js.", true);
    return;
  }

  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
  const { data } = await sb.auth.getSession();
  session = data.session;
  if (session) await salvarPerfil();
  render();

  sb.auth.onAuthStateChange(async (evento, s) => {
    const mudou = (s && s.user.id) !== (session && session.user.id);
    session = s;
    if (s && mudou) await salvarPerfil();
    render();
  });

  await carregar();

  sb.channel("diex-votos")
    .on("postgres_changes", { event: "*", schema: "public", table: "votos" }, agendarRecarga)
    .on("postgres_changes", { event: "*", schema: "public", table: "perfis" }, agendarRecarga)
    .subscribe();
})();
</script>
</body>
</html>
